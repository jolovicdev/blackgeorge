site_name: Blackgeorge
site_description: Code-first agentic framework built around Desk, Worker, and Workforce.
site_url: https://jolovicdev.github.io/blackgeorge/
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search
  - llmstxt:
      markdown_description: Code-first agentic framework built around Desk, Worker, and Workforce primitives for building predictable AI agents with tool calling, structured output, and multi-agent coordination.
      full_output: llms-full.txt
      sections:
        Core Documentation:
          - quickstart.md
          - tutorials.md
          - concepts.md
          - desk.md
          - worker.md
          - workforce.md
          - session.md
          - workflow.md
          - tools.md
          - subworkers.md
          - tool-hooks.md
          - collaboration.md
          - events.md
          - event-payloads.md
          - exceptions.md
          - core-types.md
          - multimodal.md
        Advanced Features:
          - storage.md
          - memory.md
          - adapters.md
          - testing.md
        Reference:
          - configuration.md
          - logging.md
        Examples:
          - examples.md
        Development:
          - development.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __line
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
exclude_docs: README.md
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorials: tutorials.md
  - Concepts: concepts.md
  - Desk: desk.md
  - Worker: worker.md
  - Workforce: workforce.md
  - WorkerSession: session.md
  - Workflow: workflow.md
  - Tools: tools.md
  - Subworkers: subworkers.md
  - Tool hooks: tool-hooks.md
  - Collaboration: collaboration.md
  - Events and streaming: events.md
  - Event payloads: event-payloads.md
  - Exceptions: exceptions.md
  - Multimodal: multimodal.md
  - Storage: storage.md
  - Memory: memory.md
  - Adapters: adapters.md
  - Testing: testing.md
  - Core types: core-types.md
  - Configuration: configuration.md
  - Logging: logging.md
  - Examples: examples.md
  - Development: development.md
  - AGENTS.md: agents-md.md
